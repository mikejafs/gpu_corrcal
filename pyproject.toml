[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu_corrcal"
version = "0.1.0"
description = "GPU-accelerated correlation calibration tools"
authors = [
    { name = "Michael Jafs" }
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "scipy",
    "cupy-cuda13x",
    "PyYAML"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]
